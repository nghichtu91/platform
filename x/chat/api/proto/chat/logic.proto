  // 由于需要把消息发送给自己一份 得知道原id
  required string fromId = 1;
  // 客户端发送的数据
  required ChatMsg clienReq = 2;
}
*/

// comet带着from id请求logic
message HistoryMsgReq {
  // 由于需要把消息发送给自己一份 得知道原id
  required string fromId = 1;
  // 客户端发送的数据
  required HistoryMsg clienReq = 2;
}

// 房间销毁
message RoomDestroyReq {
  // room id
  repeated string roomIds = 1;
}

// 翻译请求
message TranslateWithTarget {
  //请求者
  required string target = 1;
  //客户端请求
  required TranslateReq req = 2;
}
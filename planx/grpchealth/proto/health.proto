syntax = "proto3";

package proto;

option go_package = "github.com/nghichtu91/platform/share/planx/grpchealth/proto";

message HealthCheckRequest {
  string service = 1;
}

message HealthCheckResponse {
  enum ServingStatus {
    UNKNOWN = 0;
    SERVING = 1;
    NOT_SERVING = 2;
  }
  ServingStatus status = 1;
  string service_id = 2; // 当前服务的id
}

service Health {
  rpc Check(HealthCheckRequest) returns (HealthCheckResponse);
}
